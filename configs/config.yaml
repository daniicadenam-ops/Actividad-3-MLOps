
# CONFIGURACIÓN DEL PROYECTO MLOps - CREDIT DEFAULT

# Datos
datos:
  ruta: "data/default of credit card clients.csv"
  target: "default_payment_next_month"
  id: "ID"


# División de entrenamiento y prueba
division:
  test_size: 0.2
  random_state: 42


# CONJUNTOS DE FEATURES

features:
  - nombre: all
    columnas: ALL

  - nombre: custom
    columnas:
      - LIMIT_BAL
      - AGE
      - EDUCATION
      - MARRIAGE
      - PAY_0
      - PAY_2
      - PAY_3
      - PAY_4
      - PAY_5
      - PAY_6
      - BILL_AMT1
      - BILL_AMT2
      - BILL_AMT3
      - BILL_AMT4
      - BILL_AMT5
      - BILL_AMT6
      - PAY_AMT1
      - PAY_AMT2
      - PAY_AMT3
      - PAY_AMT4
      - PAY_AMT5
      - PAY_AMT6


# MODELOS CANDIDATOS

candidatos:
  - nombre_run: credit-logreg-c1
    tipo: logistic_regression
    parametros:
      C: 1.0
      max_iter: 1000
      class_weight: balanced

  - nombre_run: credit-logreg-c01
    tipo: logistic_regression
    parametros:
      C: 0.1
      max_iter: 1000
      class_weight: balanced

  - nombre_run: credit-random-forest
    tipo: random_forest
    parametros:
      n_estimators: 200
      max_depth: 12
      min_samples_leaf: 100
      class_weight: balanced
      random_state: 42


# MLFLOW

mlflow:
  tracking_uri: http://localhost:5000
  experimento: credit-default-training
  nombre_run: credit-default-training

# MÉTRICAS

metricas:
  umbral: 0.5

# REGISTRO DEL MODELO

registro:
  nombre_modelo: credit-default-model
  umbral_auc: 0.75


# INFERENCIA

inferencia:
  tamano_lote: 100
  carpeta_salida: "data"

# MONITOREO Y DETECCIÓN DE DRIFT - ACTIVIDAD 3

monitoreo:

  # Target Drift

  # Nivel de significancia estadística
  alfa_evento: 0.05

  # Feature Drift

  # Fracción máxima permitida de variables con drift
  # 0.30 equivale al 30 %
  umbral_drift: 0.30

  # Lote de inferencia

  lote_actual: "data/predicciones_credit_default.csv"

  # Reportes

  # Carpeta donde Evidently guardará los reportes HTML
  carpeta_reportes: "reports/drift"
